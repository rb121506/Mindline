<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline · Mindline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fbfaf7;
      color: #211c16;
      padding: 24px;
      text-align: center;
    }
    .icon {
      font-size: 56px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 12px;
      font-family: Georgia, serif;
    }
    p {
      color: #7c7468;
      font-size: 15px;
      line-height: 1.6;
      max-width: 340px;
      margin-bottom: 28px;
    }
    button {
      background: #d97706;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="icon">📓</div>
  <h1>You're offline</h1>
  <p>Mindline needs a connection to sync your entries. Previously visited pages may still be available.</p>
  <button onclick="window.location.reload()">Try again</button>
</body>
</html>
